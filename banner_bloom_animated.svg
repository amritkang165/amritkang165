<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b9bc4"/>
      <stop offset="45%" stop-color="#e9adc0"/>
      <stop offset="80%" stop-color="#f6d6a3"/>
      <stop offset="100%" stop-color="#f3cf9c"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cdc290"/>
      <stop offset="100%" stop-color="#a89a63"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="400" rx="28"/></clipPath>

    <g id="daisy">
      <g fill="#fffaf3">
        <ellipse rx="5.5" ry="2.6" transform="rotate(0) translate(6,0)"/>
        <ellipse rx="5.5" ry="2.6" transform="rotate(60) translate(6,0)"/>
        <ellipse rx="5.5" ry="2.6" transform="rotate(120) translate(6,0)"/>
        <ellipse rx="5.5" ry="2.6" transform="rotate(180) translate(6,0)"/>
        <ellipse rx="5.5" ry="2.6" transform="rotate(240) translate(6,0)"/>
        <ellipse rx="5.5" ry="2.6" transform="rotate(300) translate(6,0)"/>
      </g>
      <circle r="2.6" fill="#f0b94e"/>
    </g>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#sky)"/>

    <!-- soft ambient clouds, always present, low opacity -->
    <g fill="#ffffff" opacity="0.25" filter="url(#soft)">
      <ellipse cx="180" cy="70" rx="120" ry="30"/>
      <ellipse cx="600" cy="45" rx="150" ry="26"/>
      <ellipse cx="980" cy="90" rx="130" ry="28"/>
    </g>

    <!-- grass band -->
    <rect x="0" y="310" width="1200" height="90" fill="url(#grass)"/>
    <g stroke="#8f8350" stroke-width="1.5" opacity="0.4">
      <line x1="40" y1="400" x2="34" y2="300"/>
      <line x1="220" y1="400" x2="230" y2="305"/>
      <line x1="480" y1="400" x2="470" y2="300"/>
      <line x1="760" y1="400" x2="770" y2="303"/>
      <line x1="1000" y1="400" x2="990" y2="300"/>
      <line x1="1160" y1="400" x2="1170" y2="305"/>
    </g>

    <!-- storm overlay, dims the sky while it rains -->
    <rect width="1200" height="400" fill="#3a4266">
      <animate attributeName="opacity" values="0;0;0.28;0.28;0;0" keyTimes="0;0.68;0.72;0.90;0.94;1" dur="14s" repeatCount="indefinite"/>
    </rect>

    <!-- sweeping storm clouds -->
    <g filter="url(#soft)">
      <ellipse cy="80" rx="260" ry="55" fill="#5c6b8a" opacity="0.6">
        <animate attributeName="cx" values="-300;-300;380;380;1480" keyTimes="0;0.55;0.70;0.90;1" dur="14s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cy="55" rx="220" ry="46" fill="#6c7aa0" opacity="0.55">
        <animate attributeName="cx" values="-250;-250;700;700;1520" keyTimes="0;0.58;0.73;0.90;1" dur="14s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- rain -->
    <g id="rain" stroke="#dbe8f7" stroke-width="1.6" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.72;0.90;0.94;1" dur="14s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-6" y2="16"><animateTransform attributeName="transform" type="translate" values="120,-30;120,420" dur="0.7s" begin="0s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="-6" y2="16"><animateTransform attributeName="transform" type="translate" values="260,-30;260,420" dur="0.8s" begin="0.2s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="-6" y2="16"><animateTransform attributeName="transform" type="translate" values="380,-30;380,420" dur="0.65s" begin="0.35s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="-6" y2="16"><animateTransform attributeName="transform" type="translate" values="500,-30;500,420" dur="0.75s" begin="0.1s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="-6" y2="16"><animateTransform attributeName="transform" type="translate" values="620,-30;620,420" dur="0.7s" begin="0.5s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="-6" y2="16"><animateTransform attributeName="transform" type="translate" values="740,-30;740,420" dur="0.8s" begin="0.15s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="-6" y2="16"><animateTransform attributeName="transform" type="translate" values="860,-30;860,420" dur="0.68s" begin="0.4s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="-6" y2="16"><animateTransform attributeName="transform" type="translate" values="960,-30;960,420" dur="0.72s" begin="0.25s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="-6" y2="16"><animateTransform attributeName="transform" type="translate" values="1060,-30;1060,420" dur="0.78s" begin="0.05s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="-6" y2="16"><animateTransform attributeName="transform" type="translate" values="1150,-30;1150,420" dur="0.66s" begin="0.3s" repeatCount="indefinite"/></line>
    </g>

    <!-- name, sliding in slowly as flowers bloom -->
    <text y="160" font-family="'Playfair Display','Georgia',serif" font-size="76" font-weight="700" fill="#5c3a4a">
      <animate attributeName="x" values="-400;-400;62;62;62;-400" keyTimes="0;0.04;0.20;0.90;0.94;1" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.04;0.20;0.90;0.94;1" dur="14s" repeatCount="indefinite"/>
      AMRIT
    </text>
    <text y="238" font-family="'Playfair Display','Georgia',serif" font-size="76" font-weight="700" fill="#5c3a4a">
      <animate attributeName="x" values="1600;1600;62;62;62;1600" keyTimes="0;0.10;0.28;0.90;0.94;1" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.10;0.28;0.90;0.94;1" dur="14s" repeatCount="indefinite"/>
      KANG
    </text>
    <text x="64" y="266" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#6d4a58">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.36;0.90;1" dur="14s" repeatCount="indefinite"/>
      full-stack developer &amp; AI builder
    </text>

    <!-- proficiency tags, styled as little garden marker tags -->
    <g font-family="'Arial',sans-serif" font-size="12" font-weight="700" letter-spacing="0.5" fill="#3b4a2e">
      <g transform="translate(64,281)">
        <animateTransform attributeName="transform" type="scale" values="0.4;0.4;1;1;0.4" keyTimes="0;0.29;0.34;0.90;1" dur="14s" repeatCount="indefinite" additive="sum"/>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.29;0.34;0.90;1" dur="14s" repeatCount="indefinite"/>
        <rect width="60" height="20" rx="10" fill="#a8c491" opacity="0.9" stroke="#5c3a4a" stroke-opacity="0.3"/>
        <path d="M6 10 Q11 4 16 10 Q11 16 6 10 Z" fill="#e7f2dd"/>
        <text x="24" y="14">AI</text>
      </g>
      <g transform="translate(134,281)">
        <animateTransform attributeName="transform" type="scale" values="0.4;0.4;1;1;0.4" keyTimes="0;0.305;0.355;0.90;1" dur="14s" repeatCount="indefinite" additive="sum"/>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.305;0.355;0.90;1" dur="14s" repeatCount="indefinite"/>
        <rect width="126" height="20" rx="10" fill="#a8c491" opacity="0.9" stroke="#5c3a4a" stroke-opacity="0.3"/>
        <path d="M6 10 Q11 4 16 10 Q11 16 6 10 Z" fill="#e7f2dd"/>
        <text x="24" y="14">FULL-STACK</text>
      </g>
      <g transform="translate(270,281)">
        <animateTransform attributeName="transform" type="scale" values="0.4;0.4;1;1;0.4" keyTimes="0;0.32;0.37;0.90;1" dur="14s" repeatCount="indefinite" additive="sum"/>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.37;0.90;1" dur="14s" repeatCount="indefinite"/>
        <rect width="102" height="20" rx="10" fill="#a8c491" opacity="0.9" stroke="#5c3a4a" stroke-opacity="0.3"/>
        <path d="M6 10 Q11 4 16 10 Q11 16 6 10 Z" fill="#e7f2dd"/>
        <text x="24" y="14">IOS DEV</text>
      </g>
      <g transform="translate(382,281)">
        <animateTransform attributeName="transform" type="scale" values="0.4;0.4;1;1;0.4" keyTimes="0;0.335;0.385;0.90;1" dur="14s" repeatCount="indefinite" additive="sum"/>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.335;0.385;0.90;1" dur="14s" repeatCount="indefinite"/>
        <rect width="102" height="20" rx="10" fill="#a8c491" opacity="0.9" stroke="#5c3a4a" stroke-opacity="0.3"/>
        <path d="M6 10 Q11 4 16 10 Q11 16 6 10 Z" fill="#e7f2dd"/>
        <text x="24" y="14">BACKEND</text>
      </g>
      <g transform="translate(494,281)">
        <animateTransform attributeName="transform" type="scale" values="0.4;0.4;1;1;0.4" keyTimes="0;0.35;0.40;0.90;1" dur="14s" repeatCount="indefinite" additive="sum"/>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.40;0.90;1" dur="14s" repeatCount="indefinite"/>
        <rect width="150" height="20" rx="10" fill="#a8c491" opacity="0.9" stroke="#5c3a4a" stroke-opacity="0.3"/>
        <path d="M6 10 Q11 4 16 10 Q11 16 6 10 Z" fill="#e7f2dd"/>
        <text x="24" y="14">SYSTEM DESIGN</text>
      </g>
    </g>

    <!-- blooming daisy field -->
    <g>
      <g transform="translate(50,352)"><g><animateTransform attributeName="transform" type="scale" values="0;0;1;1;0" keyTimes="0;0.060;0.160;0.90;1" dur="14s" repeatCount="indefinite"/><use xlink:href="#daisy"/></g></g>
      <g transform="translate(140,368)"><g><animateTransform attributeName="transform" type="scale" values="0;0;1.1;1.1;0" keyTimes="0;0.082;0.182;0.90;1" dur="14s" repeatCount="indefinite"/><use xlink:href="#daisy"/></g></g>
      <g transform="translate(230,345)"><g><animateTransform attributeName="transform" type="scale" values="0;0;0.9;0.9;0" keyTimes="0;0.104;0.204;0.90;1" dur="14s" repeatCount="indefinite"/><use xlink:href="#daisy"/></g></g>
      <g transform="translate(320,372)"><g><animateTransform attributeName="transform" type="scale" values="0;0;1.2;1.2;0" keyTimes="0;0.125;0.225;0.90;1" dur="14s" repeatCount="indefinite"/><use xlink:href="#daisy"/></g></g>
      <g transform="translate(430,355)"><g><animateTransform attributeName="transform" type="scale" values="0;0;1;1;0" keyTimes="0;0.147;0.247;0.90;1" dur="14s" repeatCount="indefinite"/><use xlink:href="#daisy"/></g></g>
      <g transform="translate(560,375)"><g><animateTransform attributeName="transform" type="scale" values="0;0;1.15;1.15;0" keyTimes="0;0.169;0.269;0.90;1" dur="14s" repeatCount="indefinite"/><use xlink:href="#daisy"/></g></g>
      <g transform="translate(680,350)"><g><animateTransform attributeName="transform" type="scale" values="0;0;0.95;0.95;0" keyTimes="0;0.191;0.291;0.90;1" dur="14s" repeatCount="indefinite"/><use xlink:href="#daisy"/></g></g>
      <g transform="translate(790,378)"><g><animateTransform attributeName="transform" type="scale" values="0;0;1.2;1.2;0" keyTimes="0;0.212;0.312;0.90;1" dur="14s" repeatCount="indefinite"/><use xlink:href="#daisy"/></g></g>
      <g transform="translate(880,358)"><g><animateTransform attributeName="transform" type="scale" values="0;0;1;1;0" keyTimes="0;0.234;0.334;0.90;1" dur="14s" repeatCount="indefinite"/><use xlink:href="#daisy"/></g></g>
      <g transform="translate(970,370)"><g><animateTransform attributeName="transform" type="scale" values="0;0;1.1;1.1;0" keyTimes="0;0.256;0.356;0.90;1" dur="14s" repeatCount="indefinite"/><use xlink:href="#daisy"/></g></g>
      <g transform="translate(1070,350)"><g><animateTransform attributeName="transform" type="scale" values="0;0;0.9;0.9;0" keyTimes="0;0.278;0.378;0.90;1" dur="14s" repeatCount="indefinite"/><use xlink:href="#daisy"/></g></g>
      <g transform="translate(1150,372)"><g><animateTransform attributeName="transform" type="scale" values="0;0;1.15;1.15;0" keyTimes="0;0.300;0.400;0.90;1" dur="14s" repeatCount="indefinite"/><use xlink:href="#daisy"/></g></g>
    </g>

    <!-- firefly jar with a bouquet blooming out of it -->
    <g transform="translate(1010,318)">
      <!-- wire handle -->
      <path d="M-16 -6 Q0 -30 16 -6" fill="none" stroke="#8a7a54" stroke-width="2"/>
      <!-- jar body -->
      <path d="M-22 -6 Q-24 46 -18 52 Q0 58 18 52 Q24 46 22 -6 Z" fill="#eaf2f4" opacity="0.35" stroke="#c9d8dc" stroke-width="1.5"/>
      <!-- lid -->
      <rect x="-19" y="-12" width="38" height="9" rx="3" fill="#c9b183"/>

      <!-- bouquet stems, fanning out of the mouth -->
      <g fill="none" stroke="#7a8f5a" stroke-width="2">
        <path d="M-4 -10 Q-20 -40 -32 -66"/>
        <path d="M-2 -10 Q-10 -55 -18 -86"/>
        <path d="M0 -10 Q0 -60 2 -92"/>
        <path d="M2 -10 Q12 -55 20 -84"/>
        <path d="M4 -10 Q22 -38 34 -64"/>
        <path d="M-3 -10 Q-24 -22 -42 -44"/>
        <path d="M3 -10 Q26 -20 44 -42"/>
      </g>

      <!-- bouquet blooms, staggered like the field -->
      <g transform="translate(-32,-66)"><g><animateTransform attributeName="transform" type="scale" values="0;0;1.15;1.15;0" keyTimes="0;0.06;0.16;0.90;1" dur="14s" repeatCount="indefinite"/><use xlink:href="#daisy"/></g></g>
      <g transform="translate(-18,-86)"><g><animateTransform attributeName="transform" type="scale" values="0;0;1.3;1.3;0" keyTimes="0;0.09;0.19;0.90;1" dur="14s" repeatCount="indefinite"/><use xlink:href="#daisy"/></g></g>
      <g transform="translate(2,-92)"><g><animateTransform attributeName="transform" type="scale" values="0;0;1.4;1.4;0" keyTimes="0;0.12;0.22;0.90;1" dur="14s" repeatCount="indefinite"/><use xlink:href="#daisy"/></g></g>
      <g transform="translate(20,-84)"><g><animateTransform attributeName="transform" type="scale" values="0;0;1.25;1.25;0" keyTimes="0;0.15;0.25;0.90;1" dur="14s" repeatCount="indefinite"/><use xlink:href="#daisy"/></g></g>
      <g transform="translate(34,-64)"><g><animateTransform attributeName="transform" type="scale" values="0;0;1.1;1.1;0" keyTimes="0;0.18;0.28;0.90;1" dur="14s" repeatCount="indefinite"/><use xlink:href="#daisy"/></g></g>
      <g transform="translate(-42,-44)"><g><animateTransform attributeName="transform" type="scale" values="0;0;1;1;0" keyTimes="0;0.07;0.17;0.90;1" dur="14s" repeatCount="indefinite"/><use xlink:href="#daisy"/></g></g>
      <g transform="translate(44,-42)"><g><animateTransform attributeName="transform" type="scale" values="0;0;1;1;0" keyTimes="0;0.20;0.30;0.90;1" dur="14s" repeatCount="indefinite"/><use xlink:href="#daisy"/></g></g>

      <!-- fireflies inside, gentle independent glow -->
      <circle cx="-8" cy="18" r="3" fill="#ffdca0">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="0.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="7" cy="30" r="2.6" fill="#ff9fc2">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="8" r="2.2" fill="#ffe9b8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-4" cy="40" r="2.4" fill="#ffdca0">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.3s" begin="0.2s" repeatCount="indefinite"/>
      </circle>

      <!-- faint code glyph glowing among the fireflies -->
      <text x="-11" y="34" font-family="'Courier New',monospace" font-size="11" fill="#fff2d6">
        <animate attributeName="opacity" values="0.15;0.45;0.15" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
        &lt;/&gt;
      </text>

      <!-- one firefly drifting up and out -->
      <circle r="2" fill="#ffdca0">
        <animateTransform attributeName="transform" type="translate" values="-10,10; -26,-90" dur="6s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.7;1" dur="6s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
